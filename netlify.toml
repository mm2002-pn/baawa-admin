[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Landing page sur baawa-sn.com
[[redirects]]
  from = "/*"
  to = "/landing.html"
  status = 200
  force = true
  conditions = {Host = ["baawa-sn.com", "www.baawa-sn.com"]}

# SPA fallback pour le back-office (admin.baawa-sn.com)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
